# Strategy and pipeline parameters. No secrets here: secrets live in .env.

universe:
  source: config/universe.txt   # generated by scripts/refresh_universe.py (gitignored);
                                 # falls back to the tickers below if that file is absent
  tickers: ["AAPL", "MSFT", "NVDA", "SPY"]

data:
  provider: yfinance          # yfinance | alpaca (Phase 2)
  store_path: data/bars       # parquet, gitignored
  start: "2018-01-01"

strategy:
  name: sma_crossover
  params:
    fast: 20
    slow: 50

backtest:
  cost_bps: 5                 # per-side transaction cost, basis points
  slippage_bps: 2

execution:
  broker: simulated            # simulated | alpaca_paper (Alpaca unavailable to Canadians)
  ledger_path: data/ledger.sqlite
  sim_db_path: data/sim_broker.sqlite
  starting_cash: 100000        # simulated paper account starting balance

sentiment:                     # Phase 2c: FinBERT gate over the base signal
  enabled: true                # keyless via yfinance news; degrades to ungated on failure
  lookback_hours: 48
  half_life_hours: 24          # a headline's vote halves every 24h
  gate_threshold: 0.2          # veto long entry below -0.2, short entry above +0.2
  sources:                     # yfinance publisher whitelist (case-insensitive)
    ["reuters", "bloomberg", "barron's", "marketwatch", "cnbc",
     "yahoo finance", "thestreet", "benzinga", "investor's business daily"]

alerts:                        # Phase 3: heartbeat so an unattended cron run is observable
  enabled: true                # needs DISCORD_WEBHOOK_URL in .env; no-op without it
  timeout_seconds: 10          # a hung webhook must not wedge the daily job
  stale_after_hours: 30        # no cycle for this long = not trading; dashboard and check_pulse share it

risk:                          # enforced in Phase 2 live pipeline; documented now
  max_daily_drawdown_pct: 3.0
  max_position_pct: 20.0
  max_positions: 5             # slots to fund per cycle. The 20% cap above already implies
                               # five, so this makes the implied number explicit and enforced:
                               # ~500 names carry a live signal and only these many get funded.
  hysteresis_rank: 10          # a held name keeps its slot while it still ranks this high, so
                               # slipping from 5th to 6th does not sell it and buy it back
                               # tomorrow. Newcomers must still rank inside max_positions.
  target_risk_pct: 0.4         # each position is sized so a 1-standard-deviation day in it
                               # moves the account about this much. max_position_pct above
                               # stays as a hard backstop, so this can only ever size down.
                               # 0 disables it and restores the flat cap for every name.
                               # Why 0.4 and not the 0.5 that scored best out-of-sample:
                               # 0.3 and 0.5 tie on Sharpe (0.77 vs the flat cap's 0.52) and
                               # every risk measure is monotone in this number, so the
                               # region is flat and 0.4 sits inside it. Picking 0.5 for its
                               # return would be selecting the winner of a multiple-testing
                               # contest, which is what docs/baseline.md warns against.
  intraday_warn_pct: 2.0       # scripts/monitor_intraday.py speaks up at this mid-session
                               # drawdown, below max_daily_drawdown_pct so there is warning
                               # before the evening cycle would halt. The monitor never
                               # trades: the broker cannot fill intraday, so an early stop
                               # would execute at the same next-day open as a late one.
  vol_lookback_days: 20        # trading days of daily returns behind the volatility estimate.
                               # Fewer bars than this means volatility is unknown, and an
                               # unknown volatility gets no position rather than a full one.
  max_baseline_age_hours: 120  # skip the drawdown check when the previous equity snapshot
                               # is older than this. 120h clears a weekend (72h) and a
                               # holiday long weekend (96h); past that the gap is downtime,
                               # not one trading day, so the comparison is not a daily one.
